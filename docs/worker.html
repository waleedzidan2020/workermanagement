<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الحضور</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link rel="stylesheet" href="css/site.css"><link rel="stylesheet" href="css/worker.css"></head><body><main><div class="worker-page min-vh-100 d-flex align-items-center justify-content-center p-3"><div class="worker-card"><div class="text-center mb-4"><div class="worker-icon">👷</div><h1 class="h3">نظام الحضور</h1><p class="text-muted">تسجيل الحضور والانصراف من موقع العمل</p></div><label class="form-label" for="employeeCode">كود العامل</label><input class="form-control form-control-lg" id="employeeCode" autocomplete="off" placeholder="EMP-1025"><div class="form-text">سيتم حفظ الكود على هذا الجهاز فقط لتسهيل الاستخدام.</div><button class="btn btn-outline-primary w-100 mt-3" id="locationBtn">السماح بالموقع</button><div id="locationStatus" class="status-box mt-3 d-none"></div><button class="btn btn-success action-btn w-100 mt-4" id="attendanceBtn" disabled>CHECK IN</button><div id="messageBox" class="mt-3"></div><div class="text-center mt-4"><a href="index.html" class="small text-decoration-none">العودة للرئيسية</a></div></div></div></main><script>let loc=null;const lb=document.getElementById('locationBtn'),ab=document.getElementById('attendanceBtn'),ls=document.getElementById('locationStatus'),mb=document.getElementById('messageBox');lb.onclick=()=>{if(!navigator.geolocation){mb.innerHTML='<div class="alert alert-danger">المتصفح لا يدعم تحديد الموقع.</div>';return;}lb.disabled=true;lb.textContent='جاري تحديد الموقع...';navigator.geolocation.getCurrentPosition(p=>{loc=p.coords;ls.className='status-box mt-3 alert alert-success';ls.textContent='✅ تم تحديد موقعك — الدقة: '+Math.round(loc.accuracy)+' متر';ab.disabled=false;lb.textContent='تحديث الموقع';lb.disabled=false;},e=>{ls.className='status-box mt-3 alert alert-danger';ls.textContent='تعذر الحصول على الموقع. اسمح للموقع ثم حاول مرة أخرى.';lb.textContent='السماح بالموقع';lb.disabled=false;},{enableHighAccuracy:true,timeout:15000,maximumAge:0});};ab.onclick=()=>{mb.innerHTML='<div class="alert alert-info">هذه نسخة معاينة على GitHub Pages. تسجيل الحضور الحقيقي سيعمل بعد نشر ASP.NET Core Backend وربطه بـ Supabase.</div>';};</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
