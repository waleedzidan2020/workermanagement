<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مواقع العمل</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/admin.css"></head><body><div class="admin-shell"><aside class="sidebar" id="sidebar"><div class="sidebar-brand">نظام الحضور</div><nav class="nav flex-column gap-1"><a class="nav-link" href="dashboard.html">لوحة التحكم</a><a class="nav-link" href="employees.html">العمال</a><a class="nav-link" href="sites.html">مواقع العمل</a><a class="nav-link" href="attendance.html">الحضور</a><a class="nav-link" href="rejected-attempts.html">المحاولات المرفوضة</a><a class="nav-link" href="reports.html">التقارير</a><button class="btn btn-outline-light mt-3" id="logoutBtn">تسجيل الخروج</button></nav></aside><section class="admin-content"><header class="admin-topbar"><button class="btn btn-outline-secondary d-lg-none" id="menuBtn">☰</button><h1 class="h5 m-0">مواقع العمل</h1></header><main class="p-3 p-lg-4"><div class="d-flex justify-content-end mb-3"><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#siteModal" id="addSiteBtn">إضافة موقع</button></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>الموقع</th><th>Latitude</th><th>Longitude</th><th>النطاق</th><th>أقصى دقة</th><th>الحالة</th><th></th></tr></thead><tbody id="sitesBody"></tbody></table></div></div></main></section></div><div class="modal fade" id="siteModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">بيانات الموقع</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="siteId"><div class="mb-2"><label class="form-label">اسم الموقع</label><input id="siteName" class="form-control"></div><div class="mb-2"><label class="form-label">الوصف</label><textarea id="siteDescription" class="form-control"></textarea></div><div class="row g-2"><div class="col-6"><label class="form-label">Latitude</label><input id="siteLat" class="form-control" type="number" step="0.0000001"></div><div class="col-6"><label class="form-label">Longitude</label><input id="siteLng" class="form-control" type="number" step="0.0000001"></div></div><div class="row g-2 mt-1"><div class="col-6"><label class="form-label">Allowed Radius</label><input id="siteRadius" class="form-control" type="number" value="100"></div><div class="col-6"><label class="form-label">Max Accuracy</label><input id="siteAccuracy" class="form-control" type="number" value="50"></div></div><div class="form-check mt-3"><input id="siteActive" class="form-check-input" type="checkbox" checked><label class="form-check-label">نشط</label></div></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button><button class="btn btn-primary" id="saveSiteBtn">حفظ</button></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/api.js"></script><script src="../js/admin-common.js"></script><script src="../js/sites.js"></script></body></html>
